<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro confirmado | U-Found</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/refinamiento-visual.css}">
</head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: topbar(${usuario})}"></div>
<div th:replace="~{fragments/layout :: sidebar('reportar', ${usuario})}"></div>
<main class="dashboard-shell">
    <section class="confirmation-card">
        <header class="confirmation-heading">
            <span class="confirmation-mark"><svg th:replace="~{fragments/iconos :: icono('confirmado')}"></svg></span>
            <div>
                <h1>Objeto perdido registrado</h1>
                <p>Tu reporte ya está disponible. Guarda su código para consultar el seguimiento.</p>
                <span class="confirmation-code" th:text="${'UF-PER-' + idObjeto}">UF-PER-1</span>
            </div>
        </header>
        <div class="confirmation-summary">
            <div class="confirmation-photo">
                <img th:if="${objeto.imagenUrl != null}" th:src="@{${objeto.imagenUrl}}" th:alt="${objeto.nombre}">
                <span th:if="${objeto.imagenUrl == null}">Sin foto adjunta</span>
            </div>
            <div>
                <h2 th:text="${objeto.nombre}">Nombre del objeto</h2>
                <dl class="confirmation-meta">
                    <div><dt>Categoría</dt><dd th:text="${objeto.categoria.etiqueta}">Categoría</dd></div>
                    <div><dt>Ubicación</dt><dd th:text="${objeto.ubicacion.etiqueta}">Ubicación</dd></div>
                    <div><dt>Fecha del reporte</dt><dd th:text="${#temporals.format(objeto.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</dd></div>
                    <div><dt>Estado</dt><dd th:text="${objeto.estado.etiqueta}">Reportado</dd></div>
                </dl>
                <p class="confirmation-description" th:text="${objeto.descripcion}">Descripción del objeto.</p>
            </div>
        </div>
        <div class="confirmation-actions">
            <a class="secondary-button" th:href="@{/objetos-perdidos/registrar}">Registrar otro</a>
            <a class="primary-link" th:href="@{/objetos-perdidos/mis-reportes}">Ver mis reportes</a>
        </div>
    </section>
</main>
</body>
</html>
