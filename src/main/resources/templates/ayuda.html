<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de ayuda | U-Found</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="dashboard-page">
<div th:replace="~{fragments/layout :: topbar(${usuario})}"></div>
<div th:replace="~{fragments/layout :: sidebar('ayuda', ${usuario})}"></div>
<main class="dashboard-shell">
    <section class="section-title">
        <div>
            <h1>Asistente de ayuda</h1>
            <p>Pregunta cómo usar las funciones disponibles para tu rol.</p>
        </div>
    </section>

    <p>Abre la burbuja de Ulises para escribir una pregunta o elegir un tema.</p>
    <p class="alert" th:if="${error}" th:text="${error}"></p>
</main>
</body>
</html>
