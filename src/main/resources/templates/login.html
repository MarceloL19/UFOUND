<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | U-Found</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/refinamiento-visual.css}" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>

  <body class="login-page login-page-modern">
    <main class="login-modern-shell">
      <section class="login-hero-panel" aria-label="Presentación de U-Found">
        <div class="login-logo-card">
          <img
            class="login-logo"
            th:src="@{/img/logo-ufound.png}"
            alt="Logo de U-Found"
          />
        </div>

        <div class="login-hero-copy">
          <p class="eyebrow">UNIVERSIDAD DE LIMA</p>
          <h1>Gestión de objetos perdidos</h1>
          <p class="login-description">
            Accede al sistema para registrar, consultar y gestionar reportes
            dentro del campus.
          </p>
        </div>
      </section>

      <section
        class="login-card login-modern-card"
        aria-label="Formulario de inicio de sesión"
      >
        <form class="login-form" th:action="@{/login}" method="post">
          <h2>Iniciar sesión</h2>
          <p class="form-subtitle">Ingresa con tu correo institucional.</p>

          <div class="alert" th:if="${error}" th:text="${error}">
            No se pudo iniciar sesión.
          </div>

          <label for="correo">Correo electrónico</label>
          <input
            id="correo"
            name="correo"
            type="email"
            th:value="${correo}"
            placeholder="20235694@aloe.ulima.edu.pe"
            required
            autofocus
          />

          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Ingresa tu contraseña"
            required
          />

          <button type="submit">Ingresar</button>
        </form>
      </section>
    </main>
  </body>
</html>
