spring.application.name=proyecto-ufound

spring.datasource.url=jdbc:mysql://localhost:3306/proyecto_ufound_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${UFOUND_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080
server.servlet.session.timeout=30m

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Correo de pruebas: Mailtrap Sandbox
spring.mail.host=${UFOUND_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${UFOUND_MAIL_PORT:2525}
spring.mail.username=${UFOUND_MAIL_USERNAME:}
spring.mail.password=${UFOUND_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.trust=sandbox.smtp.mailtrap.io
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL local usada en el enlace de recuperación
ufound.app.base-url=${UFOUND_APP_BASE_URL:http://localhost:8080}
ufound.mail.from=${UFOUND_MAIL_FROM:soporte@ufound.local}